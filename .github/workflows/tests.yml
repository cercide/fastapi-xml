name: Tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Python 3.10, python: "3.10", os: ubuntu }
          - { name: Python 3.11, python: "3.11", os: ubuntu }
          - { name: Python 3.12, python: "3.12", os: ubuntu }
          - { name: Python 3.13, python: "3.13", os: ubuntu }
          - { name: Python 3.14, python: "3.14", os: ubuntu }
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip tox pytest pytest-cov
      - name: Tox
        run: |
          python3 -m tox -e py
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v1
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     fail_ci_if_error: true
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Setup Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: "2.4.1"
      - name: pre-commit
        run: |
          python -m pip install --upgrade pip pre-commit
          pre-commit run --all-files
